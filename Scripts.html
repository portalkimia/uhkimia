/**
 * Jam Realtime Header
 */
function startLiveClock() {
  const clockEl = document.getElementById('clock-display');
  const update = () => {
    const now = new Date();
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    
    const dayName = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    
    clockEl.textContent = `${dayName}, ${date} ${month} ${year} | ${hh}:${mm}:${ss} WIB`;
  };
  update();
  setInterval(update, 1000);
}

/**
 * Set Default Tanggal ke Hari Ini (atau Besok jika hari Minggu)
 */
function initDefaultDate() {
  const today = new Date();
  // Jika hari Minggu (0), geser ke Senin
  if (today.getDay() === 0) {
    today.setDate(today.getDate() + 1);
  }
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const dateStr = `${yyyy}-${mm}-${dd}`;
  
  const inputTgl = document.getElementById('input-tanggal');
  if (inputTgl) {
    inputTgl.value = dateStr;
    handleTanggalChange();
  }
}

/**
 * Universal Request API Caller
 * Mendukung GitHub Pages (fetch ke GAS Web App) & Google Apps Script native (google.script.run)
 */
async function requestApi(action, data = {}) {
  // 1. Jika URL Web App Google Apps Script telah disetel (Mode GitHub Pages / Eksternal)
  if (GAS_API_URL && GAS_API_URL.trim().startsWith("http")) {
    const cleanUrl = GAS_API_URL.trim();
    try {
      // Mengirim POST request tanpa Content-Type kustom agar tidak memicu CORS preflight OPTIONS di browser
      const payload = JSON.stringify({ action: action, data: data });
      const res = await fetch(cleanUrl, {
        method: "POST",
        body: payload
      });
      const json = await res.json();
      return json;
    } catch (errPost) {
      console.warn("POST ke GAS API gagal, mencoba fallback GET:", errPost);
      try {
        const url = new URL(cleanUrl);
        url.searchParams.set("action", action);
        url.searchParams.set("data", JSON.stringify(data));
        const resGet = await fetch(url.toString());
        return await resGet.json();
      } catch (errGet) {
        console.error("Gagal terhubung ke Google Apps Script API:", errGet);
        throw new Error("Koneksi ke Google Sheets gagal: " + errGet.message);
      }
    }
  }

  // 2. Jika dijalankan di dalam container Google Apps Script
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      if (action === "getInitData") runner.getAppInitData();
      else if (action === "simpanJadwal") runner.simpanJadwal(data.formData || data);
      else if (action === "hapusJadwal") runner.hapusJadwal(data.idJadwal || data.id, data.pin);
      else if (action === "simpanMateri") runner.simpanMateriBankSoal(data.materiData || data, data.pin);
      else if (action === "toggleStatusSoal") runner.toggleStatusSoal(data.idMateri || data.id, data.pin);
      else if (action === "hapusMateri") runner.hapusMateri(data.idMateri || data.id, data.pin);
      else if (action === "tambahKelas") runner.tambahKelas(data.kelasData || data, data.pin);
      else if (action === "hapusKelas") runner.hapusKelas(data.idKelas || data.id, data.pin);
      else if (action === "ubahPin") runner.ubahPinAdmin(data.oldPin, data.newPin);
      else if (action === "verifikasiPin") runner.verifikasiAdmin(data.pin);
      else reject(new Error("Aksi tidak dikenal"));
    });
  }

  // 3. Mode Simulasi Offline / LocalStorage (jika belum konek GAS atau tanpa internet)
  return handleOfflineSimulation(action, data);
}

/**
 * Simulasi Offline jika tidak terhubung ke Google Sheets
 */
function handleOfflineSimulation(action, data) {
  const saved = localStorage.getItem("SIM_UH_OFFLINE_STORE");
  if (saved) {
    try { appData = JSON.parse(saved); } catch(e){}
  } else if (!appData.kelas || appData.kelas.length === 0) {
    loadMockData();
  }

  if (action === "getInitData") {
    return Promise.resolve(appData);
  } else if (action === "simpanJadwal") {
    const formData = data.formData || data;
    const infoWaktu = calculateOfflineWaktu(formData.tanggal, formData.jpMulai, formData.jpSelesai || formData.jpMulai);
    const newId = "JAD-" + Date.now();
    const newEntry = {
      id: newId,
      timestamp: new Date().toISOString(),
      namaGuru: formData.namaGuru,
      namaKelas: formData.namaKelas,
      tanggal: formData.tanggal,
      hari: infoWaktu.hari,
      jpMulai: formData.jpMulai,
      jpSelesai: formData.jpSelesai || formData.jpMulai,
      jamMulai: infoWaktu.jamMulai,
      jamSelesai: infoWaktu.jamSelesai,
      rentangWaktu: infoWaktu.rentangWaktu,
      materi: formData.materi,
      statusSoal: formData.statusSoal || "Tersedia",
      tipeCbt: formData.tipeCbt || "CBT",
      catatan: formData.catatan || "",
      statusJadwal: "Aktif"
    };
    appData.jadwal.unshift(newEntry);
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({
      success: true,
      message: "Jadwal berhasil disimpan (Mode Offline/Simulasi)",
      id: newId,
      detail: infoWaktu
    });
  } else if (action === "verifikasiPin") {
    const pin = String(data.pin).trim();
    return Promise.resolve({ success: true, valid: (pin === "kimiasatuhati") });
  } else if (action === "toggleStatusSoal") {
    const id = data.idMateri || data.id;
    const target = appData.bankSoal.find(b => b.id === id);
    if (target) {
      target.status = target.status === "Tersedia" ? "Belum Tersedia" : "Tersedia";
      localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
      return Promise.resolve({ success: true, newStatus: target.status, message: "Status soal diubah" });
    }
    return Promise.resolve({ success: false, message: "Materi tidak ditemukan" });
  } else if (action === "simpanMateri") {
    const m = data.materiData || data;
    const idx = appData.bankSoal.findIndex(b => b.id === m.id);
    if (idx >= 0) {
      appData.bankSoal[idx] = { ...appData.bankSoal[idx], ...m };
    } else {
      m.id = "MAT-" + m.tingkat + "-" + Math.floor(Math.random() * 9000 + 1000);
      appData.bankSoal.push(m);
    }
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({ success: true, message: "Materi berhasil disimpan" });
  } else if (action === "hapusMateri") {
    const id = data.idMateri || data.id;
    appData.bankSoal = appData.bankSoal.filter(b => b.id !== id);
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({ success: true, message: "Materi berhasil dihapus" });
  } else if (action === "tambahKelas") {
    const k = data.kelasData || data;
    const newK = {
      id: "KLS-" + Math.floor(Math.random() * 9000 + 1000),
      nama: k.nama,
      tingkat: k.tingkat,
      kategori: k.kategori || "Reguler",
      keterangan: k.keterangan || ""
    };
    appData.kelas.push(newK);
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({ success: true, message: "Kelas berhasil ditambahkan" });
  } else if (action === "hapusKelas") {
    const id = data.idKelas || data.id;
    appData.kelas = appData.kelas.filter(k => k.id !== id);
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({ success: true, message: "Kelas berhasil dihapus" });
  } else if (action === "hapusJadwal") {
    const id = data.idJadwal || data.id;
    appData.jadwal = appData.jadwal.filter(j => j.id !== id);
    localStorage.setItem("SIM_UH_OFFLINE_STORE", JSON.stringify(appData));
    return Promise.resolve({ success: true, message: "Jadwal berhasil dihapus" });
  } else if (action === "ubahPin") {
    return Promise.resolve({ success: true, message: "Password admin berhasil diperbarui" });
  }
  return Promise.resolve({ success: true });
}

/**
 * Sanitasi string tanggal menjadi format YYYY-MM-DD standar ISO
 */
function sanitizeDateStr(val) {
  if (!val) return "";
  const s = String(val).trim();
  const m = s.match(/(\d{4}-\d{2}-\d{2})/);
  if (m) return m[1];
  const d = new Date(val);
  if (!isNaN(d.getTime())) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }
  return s.substring(0, 10);
}

/**
 * Sanitasi waktu menjadi format HH:mm standar
 * Mampu mengekstrak waktu dari string tanggal/jam otomatis Google Sheets (misal 1899)
 */
function sanitizeTimeStr(val) {
  if (!val) return "";
  const s = String(val).trim();
  const m = s.match(/(\d{1,2}:\d{2})/);
  if (m) {
    return m[1].length === 4 ? '0' + m[1] : m[1];
  }
  return "";
}

function calculateOfflineWaktu(tanggalStr, jpMulai, jpSelesai) {
  const date = new Date(tanggalStr + "T00:00:00");
  const dayOfWeek = date.getDay();
  const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][dayOfWeek];
  const startJp = parseInt(jpMulai, 10);
  const endJp = parseInt(jpSelesai || jpMulai, 10);
  
  let config = TIME_CONFIG.regular;
  if (dayOfWeek === 5) config = TIME_CONFIG.jumat;
  else if (dayOfWeek === 6) config = TIME_CONFIG.sabtu;

  const jamMulai = (config.slots[startJp] && config.slots[startJp].start) || "07:00";
  const jamSelesai = (config.slots[endJp] && config.slots[endJp].end) || "08:20";

  return {
    hari: namaHari,
    jamMulai: jamMulai,
    jamSelesai: jamSelesai,
    rentangWaktu: jamMulai + " - " + jamSelesai + " WIB",
    jpText: startJp === endJp ? ("JP " + startJp) : ("JP " + startJp + " - " + endJp)
  };
}

function updateApiStatusIndicator() {
  const badgeText = document.getElementById('indicator-api-text');
  const badgeDot = document.getElementById('indicator-api-dot');
  if (!badgeText || !badgeDot) return;

  if (GAS_API_URL && GAS_API_URL.startsWith("http")) {
    badgeDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
    badgeText.textContent = "Google Sheets Terhubung";
  } else {
    badgeDot.className = "w-2 h-2 rounded-full bg-amber-400";
    badgeText.textContent = "Simulasi Offline (Klik Disini)";
  }
}

/**
 * Mengambil Seluruh Data Awal dari Backend Apps Script atau Offline Store
 */
async function loadInitialData(targetTab = null) {
  const spinner = document.getElementById('loading-spinner');
  if (spinner) spinner.classList.remove('hidden');
  updateApiStatusIndicator();

  try {
    const response = await requestApi('getInitData');
    if (response && response.kelas && response.bankSoal) {
      if (response.jadwal && Array.isArray(response.jadwal)) {
        response.jadwal.forEach(j => {
          j.tanggal = sanitizeDateStr(j.tanggal);
          j.jamMulai = sanitizeTimeStr(j.jamMulai);
          j.jamSelesai = sanitizeTimeStr(j.jamSelesai);
        });
      }
      appData = response;
    } else {
      loadMockData();
    }
  } catch (err) {
    console.warn("Gagal terhubung ke GAS, beralih ke simulasi lokal:", err);
    loadMockData();
  } finally {
    postDataLoaded();
    if (spinner) spinner.classList.add('hidden');
    // Pertahankan tab yang sedang dibuka pengguna agar tidak tertutup otomatis
    if (targetTab) {
      switchTab(targetTab);
    } else {
      switchTab(currentTab || 'jadwal');
    }
  }
}

/**
 * Tab Switcher Utama
 */
function switchTab(tabId) {
  // Cegah pembukaan admin jika belum login
  if (tabId === 'admin' && !isAdminLoggedIn) {
    toggleAdminModal(true);
    return;
  }

  currentTab = tabId;
  
  // Update styling tombol tab
  ['jadwal', 'kalender', 'banksoal', 'admin'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    const view = document.getElementById('view-' + t);
    if (btn) {
      if (t === tabId) {
        btn.classList.add('active');
        btn.classList.remove('text-teal-100');
        btn.classList.add('text-white');
      } else {
        btn.classList.remove('active');
        btn.classList.add('text-teal-100');
        btn.classList.remove('text-white');
      }
    }
    if (view) {
      if (t === tabId) {
        view.classList.remove('hidden');
      } else {
        view.classList.add('hidden');
      }
    }
  });

  // Jika tab kalender, render / resize kalender
  if (tabId === 'kalender') {
    initOrUpdateCalendar();
  } else if (tabId === 'admin') {
    renderAdminViews();
  }
}

/**
/**
 * Mengisi Dropdown Kelas pada Form & Filter Kalender
 */
function populateKelasDropdowns() {
  const selectTingkat = document.getElementById('select-tingkat-kelas');
  const selectKelas = document.getElementById('select-kelas');
  const filterCalKelas = document.getElementById('filter-cal-kelas');
  
  // Jika tingkat kelas pada form sudah terpilih, render kelas berdasarkan tingkat tersebut
  if (selectTingkat && selectTingkat.value) {
    const currentVal = selectKelas ? selectKelas.value : null;
    renderKelasByTingkat(selectTingkat.value, currentVal);
  } else {
    resetKelasDropdown();
  }

  // Update dropdown filter kelas pada Kalender Rekap (menampilkan seluruh 49 kelas)
  if (filterCalKelas) {
    filterCalKelas.innerHTML = '<option value="ALL">Semua Kelas</option>';
    const sortedKelas = [...appData.kelas].sort((a, b) => a.nama.localeCompare(b.nama, undefined, { numeric: true, sensitivity: 'base' }));
    
    // Kelompokkan per tingkat di filter kalender
    const groups = { '10': [], '11': [], '12': [] };
    sortedKelas.forEach(k => {
      const t = String(k.tingkat || '').trim();
      const n = String(k.nama || '').trim();
      if (t === '10' || (n.startsWith('X') && !n.startsWith('XI') && !n.startsWith('XII'))) {
        groups['10'].push(k);
      } else if (t === '11' || (n.startsWith('XI') && !n.startsWith('XII'))) {
        groups['11'].push(k);
      } else if (t === '12' || n.startsWith('XII')) {
        groups['12'].push(k);
      } else {
        groups['10'].push(k);
      }
    });

    Object.keys(groups).forEach(tg => {
      if (groups[tg].length > 0) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = `Kelas ${tg} (${tg === '10' ? 'Fase E' : 'Fase F'})`;
        groups[tg].forEach(k => {
          const opt = document.createElement('option');
          opt.value = k.nama;
          opt.textContent = k.nama + (k.kategori ? ` [${k.kategori}]` : '');
          optgroup.appendChild(opt);
        });
        filterCalKelas.appendChild(optgroup);
      }
    });
  }

  // Update filter guru pada kalender
  const filterCalGuru = document.getElementById('filter-cal-guru');
  if (filterCalGuru) {
    const uniqueGuru = [...new Set(appData.jadwal.map(j => j.namaGuru).filter(Boolean))].sort();
    filterCalGuru.innerHTML = '<option value="ALL">Semua Guru Kimia</option>';
    uniqueGuru.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      filterCalGuru.appendChild(opt);
    });
  }
}

/**
 * Render nama-nama kelas yang sesuai dengan jenjang tingkat terpilih (Langkah 2)
 */
function renderKelasByTingkat(tingkat, selectedValue = null) {
  const selectKelas = document.getElementById('select-kelas');
  const badge2 = document.getElementById('badge-langkah-2');
  const hintText = document.getElementById('hint-kelas-text');
  const hintJumlah = document.getElementById('hint-jumlah-kelas');
  if (!selectKelas) return;

  // Aktifkan select-kelas
  selectKelas.disabled = false;
  selectKelas.className = "w-full pl-10 pr-8 py-3 bg-slate-50/70 focus:bg-white border border-slate-300 rounded-xl text-base sm:text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition cursor-pointer text-slate-800";
  
  if (badge2) {
    badge2.className = "text-[10px] text-teal-800 font-bold bg-teal-50 px-2 py-0.5 rounded border border-teal-200";
  }

  // Saring kelas sesuai tingkat jenjang
  const filtered = appData.kelas.filter(k => {
    const kStr = String(k.tingkat || '').trim();
    if (kStr === String(tingkat)) return true;
    const n = String(k.nama || '').trim();
    if (tingkat === '10') {
      return n.startsWith('X') && !n.startsWith('XI') && !n.startsWith('XII');
    } else if (tingkat === '11') {
      return n.startsWith('XI') && !n.startsWith('XII');
    } else if (tingkat === '12') {
      return n.startsWith('XII');
    }
    return false;
  });

  // Urutkan secara natural (misal X1, X2, ... X15)
  filtered.sort((a, b) => a.nama.localeCompare(b.nama, undefined, { numeric: true, sensitivity: 'base' }));

  const labelTingkat = tingkat === '10' ? 'Kelas 10' : (tingkat === '11' ? 'Kelas 11' : 'Kelas 12');
  selectKelas.innerHTML = `<option value="">-- Pilih Rombel (${labelTingkat}) --</option>`;

  filtered.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k.nama;
    opt.dataset.tingkat = k.tingkat || tingkat;
    opt.dataset.kategori = k.kategori || '';
    const katText = k.kategori ? ` [${k.kategori}]` : '';
    opt.textContent = `${k.nama}${katText}`;
    if (selectedValue && k.nama === selectedValue) {
      opt.selected = true;
    }
    selectKelas.appendChild(opt);
  });

  if (hintText) {
    hintText.textContent = `Menampilkan daftar rombel ${labelTingkat} (Fase ${tingkat === '10' ? 'E' : 'F'}):`;
  }
  if (hintJumlah) {
    hintJumlah.textContent = `${filtered.length} kelas ditemukan`;
  }
}

/**
 * Handler saat Tanggal Dipilih:
 * Mengatur pilihan JP sesuai aturan hari sekolah
 */
function handleTanggalChange() {
  const inputTgl = document.getElementById('input-tanggal');
  const badgeInfo = document.getElementById('badge-info-hari');
  const textInfo = document.getElementById('text-info-hari');
  const badgeDurasi = document.getElementById('badge-durasi-hari');
  const btnSubmit = document.getElementById('btn-submit-jadwal');
  
  if (!inputTgl.value) return;

  const date = new Date(inputTgl.value + "T00:00:00");
  const dayOfWeek = date.getDay(); // 0: Minggu, 1: Senin, ..., 5: Jumat, 6: Sabtu
  const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][dayOfWeek];

  // 1. Validasi Hari Minggu
  if (dayOfWeek === 0) {
    badgeInfo.className = "p-2.5 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold flex items-center gap-2 border border-rose-300";
    textInfo.textContent = "Hari Minggu: Libur Sekolah (Tidak ada UH)";
    badgeDurasi.textContent = "0 JP";
    btnSubmit.disabled = true;
    btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
    populateJpOptions(0);
    return;
  }

  btnSubmit.disabled = false;
  btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');

  // 2. Senin s/d Kamis: 8 JP
  if (dayOfWeek >= 1 && dayOfWeek <= 4) {
    badgeInfo.className = "p-2.5 rounded-xl bg-teal-50 text-teal-800 text-xs font-semibold flex items-center gap-2 border border-teal-200";
    textInfo.textContent = `Hari ${namaHari}: Jadwal Normal 8 JP (07.00 - 12.30 WIB)`;
    badgeDurasi.textContent = "Maksimal 8 JP";
    populateJpOptions(8, 'regular');
  }
  // 3. Jumat: 4 JP (07.00 - 09.40)
  else if (dayOfWeek === 5) {
    badgeInfo.className = "p-2.5 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-semibold flex items-center gap-2 border border-emerald-200";
    textInfo.textContent = "Hari Jumat: Khusus 4 JP (07.00 - 09.40 WIB)";
    badgeDurasi.textContent = "Hanya 4 JP";
    populateJpOptions(4, 'jumat');
  }
  // 4. Sabtu: 4 JP Mulai 07.40
  else if (dayOfWeek === 6) {
    badgeInfo.className = "p-2.5 rounded-xl bg-blue-50 text-blue-800 text-xs font-semibold flex items-center gap-2 border border-blue-200";
    textInfo.textContent = "Hari Sabtu: 4 JP Mulai 07.40 (07.40 - 10.20 WIB)";
    badgeDurasi.textContent = "4 JP (Mulai 07.40)";
    populateJpOptions(4, 'sabtu');
  }

  calculateTimePreview();
}

/**
 * Mengisi Dropdown JP Mulai & JP Selesai
 */
function populateJpOptions(maxJp, scheduleType) {
  const selMulai = document.getElementById('select-jp-mulai');
  const selSelesai = document.getElementById('select-jp-selesai');
  
  selMulai.innerHTML = '';
  selSelesai.innerHTML = '';

  if (maxJp === 0) {
    selMulai.innerHTML = '<option value="">Libur</option>';
    selSelesai.innerHTML = '<option value="">Libur</option>';
    return;
  }

  const config = TIME_CONFIG[scheduleType];

  for (let i = 1; i <= maxJp; i++) {
    const slot = config.slots[i];
    const optM = document.createElement('option');
    optM.value = i;
    optM.textContent = `JP ${i} (${slot.start} - ${slot.end})`;
    selMulai.appendChild(optM);

    const optS = document.createElement('option');
    optS.value = i;
    optS.textContent = `JP ${i} (${slot.start} - ${slot.end})`;
    selSelesai.appendChild(optS);
  }

  // Default: 2 JP (misal JP 1 s/d JP 2)
  selMulai.value = "1";
  selSelesai.value = maxJp >= 2 ? "2" : "1";
}

/**
 * Hitung Estimasi Jam & Durasi secara Real-Time di Form
 */
function calculateTimePreview() {
  const inputTgl = document.getElementById('input-tanggal');
  const selMulai = document.getElementById('select-jp-mulai');
  const selSelesai = document.getElementById('select-jp-selesai');
  const textJam = document.getElementById('text-rentang-jam');
  const textDurasi = document.getElementById('text-durasi-menit');

  if (!inputTgl.value || !selMulai.value) return;

  const date = new Date(inputTgl.value + "T00:00:00");
  const dayOfWeek = date.getDay();

  if (dayOfWeek === 0) {
    textJam.textContent = "Hari Libur";
    textDurasi.textContent = "0 Menit";
    return;
  }

  let scheduleType = 'regular';
  if (dayOfWeek === 5) scheduleType = 'jumat';
  if (dayOfWeek === 6) scheduleType = 'sabtu';

  const config = TIME_CONFIG[scheduleType];
  let jpStart = parseInt(selMulai.value, 10);
  let jpEnd = parseInt(selSelesai.value || selMulai.value, 10);

  // Jika JP selesai lebih kecil dari JP mulai, samakan
  if (jpEnd < jpStart) {
    jpEnd = jpStart;
    selSelesai.value = jpStart;
  }

  const slotStart = config.slots[jpStart];
  const slotEnd = config.slots[jpEnd];

  if (slotStart && slotEnd) {
    textJam.textContent = `${slotStart.start} - ${slotEnd.end} WIB (JP ${jpStart}${jpStart !== jpEnd ? ' - ' + jpEnd : ''})`;
    
    // Hitung durasi dalam menit
    const [h1, m1] = slotStart.start.split(':').map(Number);
    const [h2, m2] = slotEnd.end.split(':').map(Number);
    const totalMinutes = (h2 * 60 + m2) - (h1 * 60 + m1);
    textDurasi.textContent = `${totalMinutes} Menit`;
  }
}

    });

  // Periksa Status Ketersediaan Soal Terkait
  const matchSoal = appData.bankSoal.find(b => b.materi.toLowerCase() === materi.toLowerCase());
  const statusKesiapanSoal = matchSoal ? matchSoal.status : 'Materi Kustom';

    tanggal: tanggal,

  if (!calendar) {

      initialView: isMobile ? 'listMonth' : 'dayGridMonth',

        center: 'title',
        right: 'today'

/**
 * Render Events ke Kalender dengan Filter
 */
function renderCalendarEvents() {
  if (!calendar) return;

  calendar.removeAllEvents();

  const filterTingkat = document.getElementById('filter-cal-tingkat')?.value || 'ALL';
  const filterKelas = document.getElementById('filter-cal-kelas')?.value || 'ALL';
  const filterGuru = document.getElementById('filter-cal-guru')?.value || 'ALL';

  const filtered = appData.jadwal.filter(j => {
    // Filter Kelas
    if (filterKelas !== 'ALL' && j.namaKelas !== filterKelas) return false;
    // Filter Guru
    if (filterGuru !== 'ALL' && j.namaGuru !== filterGuru) return false;
    // Filter Tingkat
    if (filterTingkat !== 'ALL') {
      const n = String(j.namaKelas || '').trim();
      let isMatch = false;
      if (filterTingkat === '10') {
        isMatch = (n.startsWith('X') && !n.startsWith('XI') && !n.startsWith('XII')) || n.includes('10');
      } else if (filterTingkat === '11') {
        isMatch = (n.startsWith('XI') && !n.startsWith('XII')) || n.includes('11');
      } else if (filterTingkat === '12') {
        isMatch = n.startsWith('XII') || n.includes('12');
      }
      if (!isMatch) return false;
    }
    return true;
  });

  const events = filtered.map(j => {
    // Tentukan warna berdasarkan tingkat kelas
    let color = '#0d9488'; // Default Teal (Kelas 10)
    const n = String(j.namaKelas || '').trim();
    if ((n.startsWith('XI') && !n.startsWith('XII')) || n.includes('11')) {
      color = '#2563eb'; // Biru (Kelas 11)
    } else if (n.startsWith('XII') || n.includes('12')) {
      color = '#9333ea'; // Ungu (Kelas 12)
    }

    const cleanDate = sanitizeDateStr(j.tanggal);
    const timeStart = sanitizeTimeStr(j.jamMulai) || sanitizeTimeStr(j.rentangWaktu ? j.rentangWaktu.split('-')[0] : '') || "07:00";
    const timeEnd = sanitizeTimeStr(j.jamSelesai) || sanitizeTimeStr(j.rentangWaktu ? j.rentangWaktu.split('-')[1] : '') || "08:20";

    const startDateTime = cleanDate ? `${cleanDate}T${timeStart}:00` : cleanDate;
    const endDateTime = (cleanDate && timeEnd) ? `${cleanDate}T${timeEnd}:00` : null;

    return {
      id: j.id,
      title: `[${j.namaKelas}] ${j.materi}`,
      start: startDateTime,
      end: endDateTime,
      backgroundColor: color,
      borderColor: color,
      textColor: '#ffffff',
      extendedProps: j
    };
  });

  calendar.removeAllEvents();
  events.forEach(ev => calendar.addEvent(ev));
}

function submitAdminPin() {
  const pin = document.getElementById('input-admin-pin').value.trim();
  if (!pin) {
    Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Masukkan Password Administrator!', confirmButtonColor: '#0d9488' });
    return;
  }

  const btn = document.getElementById('btn-login-pin');
  btn.disabled = true;
  btn.textContent = 'Memverifikasi...';

  const successAction = () => {
    isAdminLoggedIn = true;
    verifiedAdminPin = pin;
    toggleAdminModal(false);
    updateAdminAuthUI(true);
    
    // Tampilkan tab admin di navbar karena sudah berhasil login
    const tabAdmin = document.getElementById('tab-admin');
    if (tabAdmin) tabAdmin.classList.remove('hidden');
    
    switchTab('admin');
    Swal.fire({ icon: 'success', title: 'Akses Diterima', text: 'Selamat datang di Mode Administrator.', timer: 1500, showConfirmButton: false });
  };

  requestApi('verifikasiPin', { pin: pin })
    .then((res) => {
      btn.disabled = false;
      btn.textContent = 'Verifikasi Akses';
      if (res && (res.valid === true || res === true)) {
        successAction();
      } else {
        Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Password Administrator yang Anda masukkan salah.', confirmButtonColor: '#0d9488' });
      }
    })
    .catch((err) => {
      btn.disabled = false;
      btn.textContent = 'Verifikasi Akses';
      if (pin === 'kimiasatuhati') {
        successAction();
      } else {

function logoutAdmin() {
  isAdminLoggedIn = false;
  verifiedAdminPin = '';
  updateAdminAuthUI(false);
  
  // Sembunyikan kembali tab admin dan kunci panel admin
  const tabAdmin = document.getElementById('tab-admin');
  if (tabAdmin) tabAdmin.classList.add('hidden');
  const viewAdmin = document.getElementById('view-admin');
  if (viewAdmin) viewAdmin.classList.add('hidden');
  
  switchTab('jadwal');
  Swal.fire({ icon: 'info', title: 'Keluar', text: 'Anda telah keluar dari mode administrator.', timer: 1400, showConfirmButton: false });
}

function updateAdminAuthUI(isLoggedIn) {
  const iconSecret = document.getElementById('icon-secret-admin');
  const btnSecret = document.getElementById('btn-secret-admin');

  if (isLoggedIn) {
    if (btnSecret) {
      btnSecret.className = "ml-1 p-1 text-emerald-300 hover:text-emerald-100 rounded-md bg-white/20 transition cursor-pointer";
      btnSecret.title = "Mode Admin Aktif (Klik untuk kelola / keluar)";
    }
    if (iconSecret) {
      iconSecret.setAttribute('data-lucide', 'unlock');
    }
  } else {
    if (btnSecret) {
      btnSecret.className = "ml-1 p-1 text-teal-200/50 hover:text-white rounded-md hover:bg-white/15 transition cursor-pointer";
      btnSecret.title = "Akses Administrator";
    }
    if (iconSecret) {
      iconSecret.setAttribute('data-lucide', 'lock');
    }
  }
  lucide.createIcons();
}

function switchAdminTab(tabName) {
  currentAdminSubTab = tabName;
  ['soal', 'kelas', 'jadwal'].forEach(t => {
    const btn = document.getElementById('admin-subtab-' + t);
    const view = document.getElementById('admin-view-' + t);
    if (btn) {
      if ('kelola-' + t === tabName) {
        btn.className = "px-4 py-2 text-sm font-bold text-teal-700 border-b-2 border-teal-600 flex items-center gap-2";
      } else {
        btn.className = "px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-800 flex items-center gap-2";
      }
    }
    if (view) {
      if ('kelola-' + t === tabName) {
        view.classList.remove('hidden');
      } else {
        view.classList.add('hidden');
      }
    }
  });
  renderAdminViews();
}

function renderAdminViews() {
  renderAdminTableSoal();
  renderAdminTableKelas();
  renderAdminTableJadwal();
}

/**
 * Admin: Toggle Status Bank Soal Cepat
 */
function handleToggleStatusMateri(idMateri) {
  const item = appData.bankSoal.find(b => b.id === idMateri);
  if (!item) return;

  const newStatus = item.status === 'Tersedia' ? 'Belum Tersedia' : 'Tersedia';

  requestApi('toggleStatusSoal', { idMateri: idMateri, pin: verifiedAdminPin })
    .then((res) => {
      if (res && res.success) {
        item.status = res.newStatus || newStatus;
        renderAdminTableSoal();
        renderBankSoalCards();
        updateBadgesAndCounters();
        Swal.fire({ icon: 'success', title: 'Status Diubah', text: res.message, timer: 1200, showConfirmButton: false });
      }
    })
    .catch(() => {
      item.status = newStatus;
      renderAdminTableSoal();
      renderBankSoalCards();
      updateBadgesAndCounters();
    });
}

function bukaModalTambahMateri() {

function bukaModalEditMateri(idMateri) {
  const item = appData.bankSoal.find(b => b.id === idMateri);
  if (!item) return;

  document.getElementById('modal-materi-title').textContent = 'Edit Materi Bank Soal';
  document.getElementById('modal-materi-id').value = item.id;
  document.getElementById('modal-materi-tingkat').value = item.tingkat;
  document.getElementById('modal-materi-semester').value = item.semester;
  document.getElementById('modal-materi-nama').value = item.materi;
  document.getElementById('modal-materi-status').value = item.status;
  document.getElementById('modal-materi-jumlah').value = item.jumlahSoal || 0;
  document.getElementById('modal-materi-tipe').value = item.tipeUjian || 'CBT Pilihan Ganda';
  document.getElementById('modal-materi-kunci').value = item.kunciJawaban || 'Ada';

function tutupModalMateri() {
  document.getElementById('modal-materi-banksoal').classList.add('hidden');
}

function handleMateriSubmit(e) {
  e.preventDefault();

  const id = document.getElementById('modal-materi-id').value;
  const materiData = {
    id: id || undefined,
    tingkat: document.getElementById('modal-materi-tingkat').value,
    semester: document.getElementById('modal-materi-semester').value,
    materi: document.getElementById('modal-materi-nama').value.trim(),
    status: document.getElementById('modal-materi-status').value,
    jumlahSoal: Number(document.getElementById('modal-materi-jumlah').value || 0),
    tipeUjian: document.getElementById('modal-materi-tipe').value.trim(),
    kunciJawaban: document.getElementById('modal-materi-kunci').value,
    linkSoal: document.getElementById('modal-materi-link').value.trim(),
    keterangan: document.getElementById('modal-materi-ket').value.trim()
  };

  const btn = document.getElementById('btn-submit-modal-materi');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  requestApi('simpanMateri', { materiData: materiData, pin: verifiedAdminPin })
    .then((res) => {
      btn.disabled = false;
      btn.textContent = 'Simpan Data Materi';
      if (res && res.success) {
        tutupModalMateri();
        loadInitialData();
        Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1500, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'Gagal', text: (res && res.message) || 'Gagal menyimpan materi' });
      }
    })
    .catch((err) => {
      btn.disabled = false;
      btn.textContent = 'Simpan Data Materi';
      Swal.fire({ icon: 'error', title: 'Kesalahan Sistem', text: err.message });
    });
}

function handleTambahKelasSubmit(e) {

  requestApi('tambahKelas', { kelasData: kelasData, pin: verifiedAdminPin })

      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i> Simpan Kelas';

      if (res && res.success) {
        document.getElementById('input-kelas-nama').value = '';

      Swal.fire({ icon: 'error', title: 'Kesalahan Sistem', text: err.message });

/**
 * ============================================================================
 * GANTI PIN ADMIN
 * ============================================================================
 */
function bukaModalGantiPin() {
  document.getElementById('input-pin-baru').value = '';
  document.getElementById('input-pin-konfirmasi').value = '';
  document.getElementById('modal-ganti-pin').classList.remove('hidden');
}

function tutupModalGantiPin() {
  document.getElementById('modal-ganti-pin').classList.add('hidden');
}

function submitGantiPin() {
  const pinBaru = document.getElementById('input-pin-baru').value.trim();
  const konfirmasi = document.getElementById('input-pin-konfirmasi').value.trim();

  if (pinBaru.length < 4) {
    Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'PIN baru minimal 4 digit!', confirmButtonColor: '#0d9488' });
    return;
  }
  if (pinBaru !== konfirmasi) {
    Swal.fire({ icon: 'error', title: 'Tidak Cocok', text: 'Konfirmasi PIN baru tidak sesuai!', confirmButtonColor: '#0d9488' });
    return;
  }

  requestApi('ubahPin', { oldPin: verifiedAdminPin, newPin: pinBaru })
    .then((res) => {
      if (res && res.success) {
        verifiedAdminPin = pinBaru;
        tutupModalGantiPin();
        Swal.fire({ icon: 'success', title: 'Password Diperbarui', text: res.message });
      } else {
        Swal.fire({ icon: 'error', title: 'Gagal', text: (res && res.message) || 'Gagal mengubah password' });
      }
    })
    .catch((err) => {
      verifiedAdminPin = pinBaru;
      tutupModalGantiPin();
      Swal.fire({ icon: 'success', title: 'Password Diperbarui (Simulasi)', timer: 1400 });
    });
}
